<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         SECURITY HEADERS (Frontend Layer)
         ═══════════════════════════════════════════════ -->

    <!-- Content Security Policy: Prevents XSS & unauthorized resource loading -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com http://localhost:5000 https://api.jinkzo.com https://jinkzo-backend.onrender.com https://*.tile.openstreetmap.org https://unpkg.com https://lh3.googleusercontent.com; connect-src 'self' http://localhost:5000 https://api.jinkzo.com https://jinkzo-backend.onrender.com https://nominatim.openstreetmap.org https://accounts.google.com; frame-src 'none' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" />

    <!-- Prevents this page from being embedded in iframes (clickjacking protection) -->
    
    <!-- Prevents MIME-type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Controls referrer information sent with requests -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Disable browser cache for sensitive pages -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />

    <title>Corior — Secure Food Delivery</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
